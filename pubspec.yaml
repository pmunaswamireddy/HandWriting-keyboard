name: handwriting_keyboard
description: A cross-platform keyboard app that renders your handwriting as you type.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.3.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database / persistence
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # SVG rendering
  flutter_svg: ^2.0.10+1

  # Image processing
  image: ^4.2.0

  # Google ML Kit for handwriting OCR
  google_mlkit_text_recognition: ^0.13.0

  # Speech to text (voice typing)
  speech_to_text: ^7.3.0

  # Camera / gallery
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  permission_handler: ^11.3.1

  # Sharing / export
  share_plus: ^10.0.0
  path_drawing: ^1.0.1

  # Firebase (optional cloud sync)
  firebase_core: ^3.2.0
  cloud_firestore: ^5.1.0
  firebase_auth: ^5.1.2

  # UI utilities
  google_fonts: ^6.2.1
  animations: ^2.0.11
  flutter_colorpicker: ^1.1.0
  lottie: ^3.1.2
  emoji_picker_flutter: ^4.4.0
  http: ^1.6.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/fonts/
    - assets/icons/
    - assets/lottie/

  # fonts: (handwriting fonts are generated at runtime and installed via OS)
